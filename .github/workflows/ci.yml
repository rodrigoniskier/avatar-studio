name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: pip install -e ".[dev]"
      - run: pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
      - run: git submodule update --init --depth 1 upstreams/InfiniteTalk upstreams/Wan2.2 upstreams/MuseTalk
      - run: python -c "import torch; assert not torch.cuda.is_available()"
      - run: ruff check studio scripts tests --select E9,F
      - run: pytest -q
      - run: bash -n scripts/setup_upstreams.sh scripts/setup_generative.sh
